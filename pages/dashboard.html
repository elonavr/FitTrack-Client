<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Dashboard</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>

<body>
    <header class="main-header">
        <div class="logo">FitTrack</div>
        <nav class="main-nav">
            <h3 id="welcome-message">Hello, User!</h3>
            <button id="logout-btn" class="nav-button primary">Log Out</button>
        </nav>
    </header>

    <main class="dashboard-grid">

        <section class="goal-summary card">
            <h2>🎯 Daily Goal Status</h2>
            <div id="status-container">
                <p>Loading your current goals...</p>
            </div>
            <button id="reset-day-btn" class="cta-button">Reset Day Goals</button>
        </section>

        <section class="meal-logging card">
            <h2>🍽️ Log Your Meal</h2>
            <form id="log-meal-form">
                <p>Select a food and quantity:</p>
                <div class="input-group">
                    <label for="food-item">Food Item ID (e.g., 1)</label>
                    <input type="number" id="food-item" value="1" required>
                </div>
                <div class="input-group">
                    <label for="quantity">Quantity (Servings)</label>
                    <input type="number" id="quantity" value="1" required>
                </div>
                <button type="submit" class="primary-button">Add to Tracker</button>
            </form>
        </section>

        <section class="activity-log card">
            <h2>📊 Recent Activity</h2>
            <p>Your last logged meals will appear here.</p>
        </section>

        <section class="goal-management full-width-section card">

            <h2>➕ Add New Goal</h2>
            <form id="add-goal-form" class="form-container">
                <label for="goal-name">Goal Name (e.g., Maintain Weight):</label>
                <input type="text" id="goal-name" required>

                <h3>Nutritional Targets</h3>
                <div class="macro-inputs-grid">
                    <div class="input-group">
                        <label for="target-calories">Calories (kcal):</label>
                        <input type="number" id="target-calories" required min="1000">
                    </div>

                    <div class="input-group">
                        <label for="target-protein">Protein (g):</label>
                        <input type="number" id="target-protein" required min="0">
                    </div>

                    <div class="input-group">
                        <label for="target-carbs">Carbs (g):</label>
                        <input type="number" id="target-carbs" required min="0">
                    </div>

                    <div class="input-group">
                        <label for="target-fat">Fat (g):</label>
                        <input type="number" id="target-fat" required min="0">
                    </div>
                </div>

                <button type="submit" class="primary-button">Add Goal</button>
                <p id="goal-message" class="message"></p>
            </form>

            <hr style="margin: 30px 0;">

            <h2>📝 Your Goal Plans</h2>
            <div id="goals-list">
                <p>Loading goals...</p>
            </div>

        </section>

    </main>

    <script type="module" src="../scripts/dashboard.js"></script>
</body>

</html>
