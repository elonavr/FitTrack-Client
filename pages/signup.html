<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Sign Up</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/signup.css">
</head>

<body>
    <div class="signup-container">
        <header class="auth-header">
            <a href="../index.html" class="logo">FitTrack</a>
        </header>

        <main class="auth-box">
            <h2>Start Your Journey</h2>
            <p class="subtitle">Create your FitTrack account to begin tracking your goals.</p>

            <form id="signup-form" class="auth-form">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="•••••••• (min 8 characters)" minlength="8"
                        required>
                </div>

                <div class="input-group checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms" class="inline-label">I agree to the <a href="#">Terms and Conditions</a></label>
                </div>

                <button type="submit" class="primary-button">Sign Up</button>
            </form>

            <p class="switch-link">
                Already have an account? <a href="login.html">Log In</a>
            </p>
        </main>
    </div>

    <script type="module" src="../scripts/signup.page.js"></script>
</body>

</html>
