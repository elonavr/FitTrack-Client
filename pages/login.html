<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Log In</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>
    <div class="login-container">
        <header class="auth-header">
            <a href="../index.html" class="logo">FitTrack</a>
        </header>

        <main class="auth-box">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to track your fitness progress.</p>

            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>

                        <button type="button" id="toggle-password" class="password-toggle-btn">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="primary-button">Log In</button>
            </form>

            <p class="switch-link">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
        </main>
    </div>
    <script type="module" src="../scripts/login.page.js"></script>
</body>

</html>
</body>

</html>
